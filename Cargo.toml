[workspace]
resolver = "2"
members = [
    "crates/fm-core",
    "crates/fm-fs",
    "crates/fm-index",
    "crates/fm-telemetry",
    "crates/fm-preview",
    "crates/fm-theme",
    "crates/fm-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
compact_str = { version = "0.10", features = ["serde"] }
directories = "6.0"
fast_image_resize = "6.1"
gix = { version = "0.90", default-features = false, features = ["sha1"] }
iced = { version = "0.14", features = ["wgpu", "tokio", "image", "svg", "highlighter", "advanced", "linux-theme-detection", "x11", "wayland"] }
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
infer = "0.22"
lru = "0.16"
lucide-icons = { version = "1.72", features = ["iced"] }
mimalloc = "0.1"
notify = { version = "8.2", default-features = false }
notify-debouncer-mini = { version = "0.7", default-features = false }
nucleo-matcher = "0.3"
open = "5.4"
rayon = "1.12"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "fs", "sync", "time"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

fm-core = { path = "crates/fm-core" }
fm-fs = { path = "crates/fm-fs" }
fm-index = { path = "crates/fm-index" }
fm-telemetry = { path = "crates/fm-telemetry" }
fm-preview = { path = "crates/fm-preview" }
fm-theme = { path = "crates/fm-theme" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
