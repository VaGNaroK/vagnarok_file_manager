name: Release Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag existente para empacotar (ex: v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight & Tests
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      numeric_version: ${{ steps.meta.outputs.numeric_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Validate version and extract release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          if [[ -z "${VERSION}" || "${TAG_NAME}" == "${VERSION}" ]]; then
            echo "::error::Tag invalida '${TAG_NAME}'. Deve iniciar com 'v' (ex: v0.1.0-alpha.1)."
            exit 1
          fi

          python3 - "${VERSION}" << 'PY'
          import os
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          with open("Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)

          cargo_version = cargo["workspace"]["package"]["version"]
          if cargo_version != version:
              print(
                  f"::error::Versao do Cargo.toml ({cargo_version}) difere da tag ({version}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          m = re.match(r"^(\d+\.\d+\.\d+)(?:-(.+))?$", version)
          if not m:
              print(f"::error::Versao '{version}' nao segue SemVer.", file=sys.stderr)
              sys.exit(1)

          base_ver, pre = m.group(1), m.group(2)
          numeric_version = f"{base_ver}.0"
          is_prerelease = "true" if pre else "false"

          os.makedirs("release-meta", exist_ok=True)
          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  changelog = f.read()
              pattern = re.compile(
                  rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(changelog)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = f"Release `{version}` do **Vagnarok File Manager**."

          with open("release-meta/RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as out:
              out.write(f"tag_name=v{version}\n")
              out.write(f"version={version}\n")
              out.write(f"numeric_version={numeric_version}\n")
              out.write(f"is_prerelease={is_prerelease}\n")
          PY

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libgtk-3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting, clippy and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-meta/RELEASE_NOTES.md

  package-deb:
    name: Package Linux (.deb)
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag_name }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libgtk-3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Build .deb package
        run: |
          mkdir -p dist
          cargo deb -p fm-app --no-strip -o "dist/vagnarok-file-manager-${{ needs.preflight.outputs.version }}-linux-amd64.deb"
          dpkg-deb --info "dist/vagnarok-file-manager-${{ needs.preflight.outputs.version }}-linux-amd64.deb"
          dpkg-deb --contents "dist/vagnarok-file-manager-${{ needs.preflight.outputs.version }}-linux-amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: dist/*.deb

  package-flatpak:
    name: Package Linux (Flatpak)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag_name }}

      - name: Setup Rust toolchain (for offline vendoring)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Vendor Cargo dependencies for offline Flatpak build
        run: |
          cargo vendor --locked vendor
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          EOF

      - name: Build Flatpak bundle
        run: |
          mkdir -p dist repo
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo flatpak-build packaging/flatpak/dev.vagnarok.FileManager.yml
          flatpak build-bundle repo "dist/vagnarok-file-manager-${{ needs.preflight.outputs.version }}-linux-x86_64.flatpak" dev.vagnarok.FileManager

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-flatpak
          path: dist/*.flatpak

  package-windows:
    name: Package Windows (Inno Setup + Portable ZIP)
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag_name }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Windows release binary
        run: cargo build --release --locked -p fm-app

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = "dist\portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\vagnarok-file-manager.exe" "$stage\"
          Copy-Item "LICENSE" "$stage\"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\vagnarok-file-manager-$version-windows-x86_64-portable.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup -y --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc "/DAppVersion=${{ needs.preflight.outputs.version }}" "/DNumericVersion=${{ needs.preflight.outputs.numeric_version }}" packaging\windows\vagnarok.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [preflight, package-deb, package-flatpak, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-meta

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: dist-deb
          path: dist

      - name: Download Linux Flatpak
        uses: actions/download-artifact@v4
        with:
          name: dist-flatpak
          path: dist

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag_name }}
          name: v${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          body_path: release-meta/RELEASE_NOTES.md
          files: dist/*
